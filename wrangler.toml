name = "gzh-hot-site"
main = "src/worker.js"
compatibility_date = "2024-09-23"
account_id = "47e9ef08e724b2aa5f8f172f5ca6a305"

# D1 数据库绑定（database_id 在 `wrangler d1 create gzh-hot-db` 后回填）
[[d1_databases]]
binding = "DB"
database_name = "gzh-hot-db"
database_id = "53a8de8a-3606-4fc0-a7d4-25269e6119d3"

# 每 10 分钟触发一次抓取（Cron: */10 * * * *）
[triggers]
crons = ["*/10 * * * *"]
